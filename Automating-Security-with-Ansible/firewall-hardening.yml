---
- name: Firewall Security Configuration
  hosts: all
  become: yes
  vars:
    allowed_ports:
      - 22/tcp    # SSH
      - 80/tcp    # HTTP
      - 443/tcp   # HTTPS
    
  tasks:
    - name: Install firewalld
      package:
        name: firewalld
        state: present
        
    - name: Start and enable firewalld
      systemd:
        name: firewalld
        state: started
        enabled: yes
        
    - name: Set default zone to drop
      firewalld:
        zone: drop
        state: present
        permanent: yes
        immediate: yes
        
    - name: Configure public zone as default
      command: firewall-cmd --set-default-zone=public
      
    - name: Remove unnecessary services from public zone
      firewalld:
        zone: public
        service: "{{ item }}"
        permanent: yes
        immediate: yes
        state: disabled
      loop:
        - dhcpv6-client
        - cockpit
      ignore_errors: yes
      
    - name: Allow essential ports in public zone
      firewalld:
        zone: public
        port: "{{ item }}"
        permanent: yes
        immediate: yes
        state: enabled
      loop: "{{ allowed_ports }}"
      
    - name: Enable SSH service in public zone
      firewalld:
        zone: public
        service: ssh
        permanent: yes
        immediate: yes
        state: enabled
        
    - name: Configure rate limiting for SSH
      firewalld:
        zone: public
        rich_rule: 'rule service name="ssh" accept limit value="3/m"'
        permanent: yes
        immediate: yes
        state: enabled
        
    - name: Block common attack ports
      firewalld:
        zone: public
        port: "{{ item }}"
        permanent: yes
        immediate: yes
        state: disabled
      loop:
        - 23/tcp    # Telnet
        - 135/tcp   # RPC
        - 139/tcp   # NetBIOS
        - 445/tcp   # SMB
        - 1433/tcp  # SQL Server
        - 3389/tcp  # RDP
      ignore_errors: yes
      
    - name: Reload firewalld configuration
      command: firewall-cmd --reload

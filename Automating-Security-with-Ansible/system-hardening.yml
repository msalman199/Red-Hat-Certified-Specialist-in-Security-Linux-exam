---
- name: System Security Hardening
  hosts: all
  become: yes
  
  tasks:
    - name: Update all packages
      package:
        name: '*'
        state: latest
      when: ansible_os_family == "RedHat"
      
    - name: Install security packages
      package:
        name:
          - fail2ban
          - aide
          - rkhunter
          - chkrootkit
        state: present
        
    - name: Configure fail2ban for SSH
      copy:
        content: |
          [sshd]
          enabled = true
          port = ssh
          filter = sshd
          logpath = /var/log/secure
          maxretry = 3
          bantime = 3600
          findtime = 600
        dest: /etc/fail2ban/jail.d/sshd.conf
      notify: restart fail2ban
      
    - name: Start and enable fail2ban
      systemd:
        name: fail2ban
        state: started
        enabled: yes
        
    - name: Set password policy - minimum length
      lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^#?minlen'
        line: 'minlen = 8'
        
    - name: Set password policy - complexity
      lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^#?minclass'
        line: 'minclass = 3'
        
    - name: Configure login timeout
      lineinfile:
        path: /etc/profile
        line: 'export TMOUT=900'
        
    - name: Disable unused network protocols
      copy:
        content: |
          install dccp /bin/true
          install sctp /bin/true
          install rds /bin/true
          install tipc /bin/true
        dest: /etc/modprobe.d/blacklist-rare-network.conf
        
    - name: Set kernel parameters for security
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { name: 'net.ipv4.ip_forward', value: '0' }
        - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.send_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.secure_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.secure_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.log_martians', value: '1' }
        - { name: 'net.ipv4.conf.default.log_martians', value: '1' }
        - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
        - { name: 'net.ipv4.icmp_ignore_bogus_error_responses', value: '1' }
        - { name: 'net.ipv4.tcp_syncookies', value: '1' }
        
    - name: Remove unnecessary packages
      package:
        name:
          - telnet
          - rsh
          - ypbind
          - ypserv
          - tftp
          - tftp-server
          - talk
          - talk-server
        state: absent
      ignore_errors: yes
      
    - name: Set file permissions on sensitive files
      file:
        path: "{{ item }}"
        mode: '0600'
        owner: root
        group: root
      loop:
        - /etc/ssh/sshd_config
        - /etc/shadow
        - /etc/gshadow
      ignore_errors: yes
      
  handlers:
    - name: restart fail2ban
      systemd:
        name: fail2ban
        state: restarted

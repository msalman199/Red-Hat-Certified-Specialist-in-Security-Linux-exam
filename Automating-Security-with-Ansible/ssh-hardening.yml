---
- name: SSH Security Hardening
  hosts: all
  become: yes
  vars:
    ssh_config_file: /etc/ssh/sshd_config
    backup_suffix: ".backup.{{ ansible_date_time.epoch }}"
  
  tasks:
    - name: Backup original SSH configuration
      copy:
        src: "{{ ssh_config_file }}"
        dest: "{{ ssh_config_file }}{{ backup_suffix }}"
        remote_src: yes
      
    - name: Disable root login via SSH
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        backup: yes
      notify: restart sshd
      
    - name: Disable password authentication
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: restart sshd
      
    - name: Disable empty passwords
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?PermitEmptyPasswords'
        line: 'PermitEmptyPasswords no'
      notify: restart sshd
      
    - name: Set maximum authentication attempts
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?MaxAuthTries'
        line: 'MaxAuthTries 3'
      notify: restart sshd
      
    - name: Set client alive interval
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?ClientAliveInterval'
        line: 'ClientAliveInterval 300'
      notify: restart sshd
      
    - name: Set client alive count max
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?ClientAliveCountMax'
        line: 'ClientAliveCountMax 2'
      notify: restart sshd
      
    - name: Disable X11 forwarding
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?X11Forwarding'
        line: 'X11Forwarding no'
      notify: restart sshd
      
    - name: Set SSH protocol version 2
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?Protocol'
        line: 'Protocol 2'
      notify: restart sshd
      
    - name: Configure allowed users (optional)
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?AllowUsers'
        line: 'AllowUsers centos'
      notify: restart sshd
      when: ssh_allow_users is defined
      
    - name: Validate SSH configuration
      command: sshd -t
      changed_when: false
      
  handlers:
    - name: restart sshd
      systemd:
        name: sshd
        state: restarted
        enabled: yes
